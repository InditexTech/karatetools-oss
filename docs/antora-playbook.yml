        - from: '/karatetools-oss/prerelease/contributing/step-by-step.html'
          to: '/prerelease/main/contributing/step-by-step/'
        # --- latest (targets docs/v6.0.0): same restructuring as prerelease ---
        # docs/v6.0.0 got the full HOME+topic-modules → ROOT+main move too,
        # not just the site-wide html_extension_style flip — confirmed
        # against the actual republished tag (only modules/main/nav.adoc
        # exists there now, no HOME/configuration/clients/etc.) — so this is
        # a straight mirror of the prerelease block above, one rule per real
