---
name: docs-publish

on:
  workflow_dispatch:
    inputs:
      VERSION:
        description: 'Version to publish'
        required: false
      AUTODEPLOY_BRANCH:
        description: 'Branch to autodeploy'
        required: false
      ENVIRONMENT:
        description: 'Environment to deploy'
        required: true

concurrency:
  group: docs-publish-${{ github.event.inputs.VERSION }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Docs / Publish
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event.inputs.ENVIRONMENT }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Decide reference branch
      id: decide-branch
      env:
        AUTODEPLOY_BRANCH: ${{ github.event.inputs.AUTODEPLOY_BRANCH }}
        VERSION: ${{ github.event.inputs.VERSION }}
      run: |
        if [ -n "$AUTODEPLOY_BRANCH" ]; then
          echo "REFERENCE_BRANCH=$AUTODEPLOY_BRANCH" >> "$GITHUB_ENV"
        else
          echo "REFERENCE_BRANCH=docs/v${VERSION}" >> "$GITHUB_ENV"
        fi

    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        ref: ${{ steps.decide-branch.outputs.REFERENCE_BRANCH }}
        persist-credentials: false

    - name: Configure Pages
      uses: actions/configure-pages@v6

    - name: NPM / Setup Dependencies Cache
      uses: actions/cache@v6
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Setup asdf Cache
      id: asdf-cache
      uses: actions/cache@v6
      continue-on-error: true
      with:
        path: ~/.asdf/data
        key: ${{ runner.os }}-asdf-${{ hashFiles('**/.tool-versions') }}
        restore-keys: |
          ${{ runner.os }}-asdf-

    - name: Save tool-versions content
      run: |
        DELIMITER="EOF_$(openssl rand -hex 16)"
        {
          echo "TOOL_VERSIONS<<${DELIMITER}"
          cat docs/.tool-versions
          echo "${DELIMITER}"
        } >> "$GITHUB_ENV"

    - name: Node / Setup asdf environment
      uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4
      # https://github.com/asdf-vm/actions/issues/356
      if: steps.asdf-cache.outputs.cache-hit != 'true'
      with:
        tool_versions: ${{ env.TOOL_VERSIONS }}

    - name: Docker / Execute Kroki server
      run: |
        docker run \
          -p 8000:8000 \
          --name krokiserver \
          --health-cmd="curl -s --fail http://localhost:8000/health || exit 1" \
          --health-interval=2s \
          --health-retries=5 \
          --health-timeout=1s \
          -d yuzutech/kroki@sha256:6980bfb218b48b74ea14b888d9c7e8c032d1cb6325f3292277abdf62483abd9d

        max_attempts=5
        attempt=1
        backoff=2

        while ! docker inspect --format='{{json .State.Health.Status}}' krokiserver | grep -q "healthy"; do
          echo "Kroki server is not ready yet. Waiting for $backoff seconds..."
          sleep $backoff

          attempt=$((attempt + 1))

          if [ $attempt -gt $max_attempts ]; then
            echo "Kroki server failed to start after $max_attempts attempts. Exiting..."
            exit 1
          fi
        done

    - name: NPM / Verify
      working-directory: docs
      run: |
        npm run verify

    - name: NPM / Publish
      working-directory: docs
      run: |
        npm run publish

    - name: Upload Artifacts
      uses: actions/upload-pages-artifact@v5
      with:
        path: docs/build/site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
