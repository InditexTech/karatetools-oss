name: code-release-preview

on:
  pull_request:
    types: [labeled, synchronize, ready_for_review, opened, reopened]
    branches: [main, main-*, develop, develop-*]

permissions:
  contents: read

concurrency:
  group: code-release-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  WORKING_DIRECTORY: ${{ vars.WORKING_DIRECTORY }}
  ASDF_BRANCH_VERSION: '0.18.0'

jobs:
  release-preview:
    name: Release Preview
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (vars.DEVELOPMENT_FLOW == 'trunk-based-development' && (github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'main-'))) ||
        (vars.DEVELOPMENT_FLOW == 'git-flow' && (github.event.pull_request.base.ref == 'main' || startsWith(github.event.pull_request.base.ref, 'main-')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      merge_commit: ${{ steps.merge-commit.outputs.merge_commit }}
      lifecycle_mode: ${{ steps.lifecycle.outputs.mode }}
      release_bump: ${{ steps.release-type.outputs.release_bump }}
    steps:
      - name: Resolve pull request merge commit
        id: merge-commit
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/pull/${GITHUB_EVENT_NUMBER}/merge" ]] \
            || [[ ! "$MERGE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || [[ "$MERGE_SHA" == "$HEAD_SHA" ]]; then
            echo "::error title=No merge commit::GitHub provides no merge commit of this pull request with its base, so no release can be proposed."
            body=$'### Release Preview\n\nGitHub provides no merge commit of this pull request with its base (for example, it conflicts with its base), so no release is proposed. Resolve the conflict to get a preview.'
            gh pr comment "$GITHUB_EVENT_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$body"
            exit 1
          fi
          echo "merge_commit=$MERGE_SHA" >> "$GITHUB_OUTPUT"

      - name: Check out pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.merge-commit.outputs.merge_commit }}

      - name: Resolve governed project type
        shell: bash
        run: |
          set -euo pipefail
          descriptor="$GITHUB_WORKSPACE/.github/inditextech-ci-java.json"
          if [[ ! -f "$descriptor" ]]; then
            echo "::error title=Missing descriptor::.github/inditextech-ci-java.json not found."
            exit 1
          fi
          project_type="$(jq -r '.project_type // empty' "$descriptor")"
          case "$project_type" in
            single|monorepo) ;;
            *)
              echo "::error title=Invalid project type::Descriptor .project_type must be single or monorepo."
              exit 1
              ;;
          esac
          workdir="${WORKING_DIRECTORY:-$(jq -r '.working_directory // empty' "$descriptor")}"
          case "$workdir" in
            ""|/*|..|../*|*/..|*/../*)
              echo "::error title=Invalid working directory::WORKING_DIRECTORY must be a non-empty relative repository path." >&2
              exit 1
              ;;
          esac
          if [[ ! -d "$workdir" ]]; then
            echo "::error title=Missing working directory::'${workdir}' is not a directory in this checkout." >&2
            exit 1
          fi
          echo "WORKING_DIRECTORY=${workdir}" >> "$GITHUB_ENV"
          echo "PROJECT_TYPE=$project_type" >> "$GITHUB_ENV"

      - name: Resolve release lifecycle
        id: lifecycle
        shell: bash
        run: |
          set -euo pipefail
          descriptor="$GITHUB_WORKSPACE/.github/inditextech-ci-java.json"
          mode="$(jq -r '.release.lifecycle // "govern-inject"' "$descriptor")"
          case "$mode" in
            govern-inject|delegated) ;;
            *)
              echo "::error title=Invalid release lifecycle::release.lifecycle must be govern-inject or delegated."
              exit 1
              ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Set up workflow Java
        if: steps.lifecycle.outputs.mode != 'delegated'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25.0.2+10.0.LTS'
          cache: maven
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/**/pom.xml

      - name: Read governed tool versions
        id: tool-versions
        if: steps.lifecycle.outputs.mode != 'delegated'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Evq '^[a-zA-Z0-9_-]+ [a-zA-Z0-9._+-]+$' .tool-versions; then
            echo "::error title=Invalid tool-versions::${WORKING_DIRECTORY}/.tool-versions is malformed."
            exit 1
          fi
          {
            echo "tool_versions<<EOF"
            cat .tool-versions
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up asdf-managed Java
        if: steps.lifecycle.outputs.mode != 'delegated'
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          tool_versions: ${{ steps.tool-versions.outputs.tool_versions }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: Resolve build JDK from .tool-versions
        id: jdk
        if: steps.lifecycle.outputs.mode != 'delegated'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "java_home=$(asdf where java)" >> "$GITHUB_OUTPUT"

      - name: Check CHANGELOG has Unreleased changes
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'skip-release') &&
          github.event.pull_request.head.ref != 'automated/ci-governance-sync' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "origin/$BASE_REF"...HEAD -- CHANGELOG.md; then
            echo "::error title=No CHANGELOG changes::Update the Unreleased section with this release's changes."
            gh pr comment "$GITHUB_EVENT_NUMBER" --repo "$GITHUB_REPOSITORY" --body $'### :x: No changes in `CHANGELOG.md`\nUpdate the `## [Unreleased]` section listing the changes for this release before merging.'
            exit 1
          fi

      - name: Resolve release type
        id: release-type
        env:
          DEVELOPMENT_FLOW: ${{ vars.DEVELOPMENT_FLOW }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ",$RELEASE_LABELS," == *",skip-release,"* ]]; then
            body=$'### Release Preview\n\nThis pull request has the `skip-release` label and will not create a Java release.'
            gh pr comment "$GITHUB_EVENT_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$body"
            exit 0
          fi

          case ",$RELEASE_LABELS," in
            *",release-type/major,"*) release_bump="major" ;;
            *",release-type/minor,"*) release_bump="minor" ;;
            *",release-type/hotfix,"*|*",release-type/multi-hotfix,"*|*",release-type/patch,"*)
              release_bump="patch"
              ;;
            *)
              if [[ "$DEVELOPMENT_FLOW" == "trunk-based-development" ]]; then
                release_bump="minor"
              else
                body=$'### Release Preview\n\nAdd a `release-type/...` label to calculate a release for this git-flow pull request.'
                gh pr comment "$GITHUB_EVENT_NUMBER" \
                  --repo "$GITHUB_REPOSITORY" \
                  --body "$body"
                exit 0
              fi
              ;;
          esac

          echo "release_bump=$release_bump" >> "$GITHUB_OUTPUT"

      - name: Resolve release packages
        id: release-packages
        if: steps.lifecycle.outputs.mode != 'delegated' && steps.release-type.outputs.release_bump != ''
        env:
          JAVA_HOME: ${{ steps.jdk.outputs.java_home }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          descriptor="$GITHUB_WORKSPACE/.github/inditextech-ci-java.json"
          artifact_id() {
            printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//'
          }
          read_version() {
            if [[ -n "$1" ]]; then
              mvn -q -B --no-transfer-progress -f pom.xml -pl ":$1" \
                help:evaluate -Dexpression=project.version -DforceStdout
            else
              mvn -q -B --no-transfer-progress -f pom.xml \
                help:evaluate -Dexpression=project.version -DforceStdout
            fi
          }
          read_artifact() {
            mvn -q -B --no-transfer-progress -f pom.xml \
              help:evaluate -Dexpression=project.artifactId -DforceStdout
          }

          if [[ "$PROJECT_TYPE" == "single" ]]; then
            release_strategy=single
            artifact="$(read_artifact)"
            declared="$(read_version "")"
            modules="$(jq -cn --arg artifact "$artifact" '[$artifact]')"
            packages="$(jq -cn --arg name "$artifact" --arg declared "$declared" \
              '[{name: $name, "tag-prefix": "", "declared-version": $declared}]')"
          elif [[ "$PROJECT_TYPE" == "monorepo" ]]; then
            release_strategy="$(jq -er '.release.strategy' "$descriptor")"
            entries="$RUNNER_TEMP/java-release-version-packages.jsonl"
            : > "$entries"
            while IFS= read -r package; do
              module="$(artifact_id "$package")"
              declared="$(read_version "$module")"
              jq -cn --arg module "$module" --arg declared "$declared" \
                '{module: $module, declared: $declared}' >> "$entries"
            done < <(jq -er '.release.packages[]' "$descriptor")
            modules="$(jq -cs 'map(.module)' "$entries")"
            case "$release_strategy" in
              independent)
                packages="$(jq -cs 'map({name: .module, "tag-prefix": "\(.module)-", "declared-version": .declared})' "$entries")"
                ;;
              locked-step)
                packages="$(jq -cs '[{name: (map(.module) | join(", ")), "tag-prefix": "", "declared-version": .[0].declared}]' "$entries")"
                ;;
              *)
                echo "::error title=Invalid release strategy::.release.strategy must be locked-step or independent."
                exit 1
                ;;
            esac
          else
            echo "::error title=Invalid project type::PROJECT_TYPE must be single or monorepo."
            exit 1
          fi

          {
            echo "strategy=$release_strategy"
            echo "modules=$modules"
            echo "packages=$packages"
          } >> "$GITHUB_OUTPUT"

      - name: Compute release version
        id: release-version
        if: steps.lifecycle.outputs.mode != 'delegated' && steps.release-type.outputs.release_bump != ''
        uses: InditexTech/gh-actions/release-version@ab7978dfa118776238a6982e445707a1ae6c0668 # v1.2.0
        with:
          release-type: ${{ steps.release-type.outputs.release_bump }}
          tag-format: bare
          strategy: ${{ steps.release-packages.outputs.strategy }}
          packages: ${{ steps.release-packages.outputs.packages }}
          dev-suffix: '-SNAPSHOT'

      - name: Calculate release preview
        if: steps.lifecycle.outputs.mode != 'delegated' && steps.release-type.outputs.release_bump != ''
        env:
          DEVELOPMENT_FLOW: ${{ vars.DEVELOPMENT_FLOW }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BUMP: ${{ steps.release-type.outputs.release_bump }}
          RELEASE_PACKAGES: ${{ steps.release-packages.outputs.packages }}
          RELEASE_STRATEGY: ${{ steps.release-packages.outputs.strategy }}
          RELEASES: ${{ steps.release-version.outputs.releases }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          merge_strategy="Create a merge commit"
          if [[ "$DEVELOPMENT_FLOW" == "trunk-based-development" ]]; then
            merge_strategy="Squash and merge"
          fi

          release_lines="$(jq -er '.[] |
            "- `\(.package)`: latest release \(if .base == "" then "_none (first release)_" else "`\(.base)`" end) -> proposed `\(.version)` (tag `\(.tag)`, next development `\(.next_dev)`)"' <<< "$RELEASES")"
          if [[ "$RELEASE_STRATEGY" == "single" ]]; then
            versions="$release_lines"
          else
            versions="- Reactor release strategy: \`$RELEASE_STRATEGY\`"$'\n'"$release_lines"
          fi

          warnings="$(jq -er --argjson packages "$RELEASE_PACKAGES" '
            [to_entries[]
              | select(.value.declared_ahead)
              | "> :warning: Declared version `\($packages[.key]."declared-version" | sub("-SNAPSHOT$"; ""))` of `\(.value.package)` is ahead of the computed release `\(.value.version)`; the cut releases `\(.value.version)` (the `release-type/...` label sets the version)."]
            | join("\n")' <<< "$RELEASES")"
          warning_block=""
          if [[ -n "$warnings" ]]; then
            while IFS= read -r warning; do
              warning="${warning#> :warning: }"
              echo "::warning title=Declared version ahead::${warning//\`/}"
            done <<< "$warnings"
            warning_block=$'\n'"$warnings"$'\n'
          fi

          changes="$(awk '
            BEGIN { capture=0 }
            /^## \[[Uu]nreleased\]/ { capture=1; next }
            capture && /^## \[/ { capture=0 }
            capture { print }
          ' CHANGELOG.md)"

          body="$(printf "%s\n\n%s\n- Release type: \`%s\`\n- Expected merge strategy: **%s**\n%s\n#### Changes\n%s" \
            '### Java Release Preview' \
            "$versions" \
            "$RELEASE_BUMP" \
            "$merge_strategy" \
            "$warning_block" \
            "$changes")"
          gh pr comment "$GITHUB_EVENT_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$body"

  delegated-release-preview:
    name: Delegated Release Preview sandbox
    needs: release-preview
    if: needs.release-preview.outputs.lifecycle_mode == 'delegated' && needs.release-preview.outputs.release_bump != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      reason: ${{ steps.delegate.outputs.reason }}
      tag: ${{ steps.delegate.outputs.tag }}
      versions: ${{ steps.delegate.outputs.versions }}
    steps:
      - name: Check out pull request merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-preview.outputs.merge_commit }}

      - name: Resolve governed project type
        shell: bash
        run: |
          set -euo pipefail
          descriptor="$GITHUB_WORKSPACE/.github/inditextech-ci-java.json"
          if [[ ! -f "$descriptor" ]]; then
            echo "::error title=Missing descriptor::.github/inditextech-ci-java.json not found."
            exit 1
          fi
          project_type="$(jq -r '.project_type // empty' "$descriptor")"
          case "$project_type" in
            single|monorepo) ;;
            *)
              echo "::error title=Invalid project type::Descriptor .project_type must be single or monorepo."
              exit 1
              ;;
          esac
          workdir="${WORKING_DIRECTORY:-$(jq -r '.working_directory // empty' "$descriptor")}"
          case "$workdir" in
            ""|/*|..|../*|*/..|*/../*)
              echo "::error title=Invalid working directory::WORKING_DIRECTORY must be a non-empty relative repository path." >&2
              exit 1
              ;;
          esac
          if [[ ! -d "$workdir" ]]; then
            echo "::error title=Missing working directory::'${workdir}' is not a directory in this checkout." >&2
            exit 1
          fi
          echo "WORKING_DIRECTORY=${workdir}" >> "$GITHUB_ENV"
          echo "PROJECT_TYPE=$project_type" >> "$GITHUB_ENV"

      - name: Read governed tool versions
        id: tool-versions
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -Evq '^[a-zA-Z0-9_-]+ [a-zA-Z0-9._+-]+$' .tool-versions; then
            echo "::error title=Invalid tool-versions::${WORKING_DIRECTORY}/.tool-versions is malformed."
            exit 1
          fi
          {
            echo "tool_versions<<EOF"
            cat .tool-versions
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up asdf-managed Java
        uses: asdf-vm/actions/install@b7bcd026f18772e44fe1026d729e1611cc435d47 # v4.0.1
        with:
          tool_versions: ${{ steps.tool-versions.outputs.tool_versions }}
          asdf_version: ${{ env.ASDF_BRANCH_VERSION }}

      - name: Resolve build JDK from .tool-versions
        id: jdk
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "java_home=$(asdf where java)" >> "$GITHUB_OUTPUT"

      - name: Plan delegated release preview
        id: delegated-plan
        env:
          JAVA_HOME: ${{ steps.jdk.outputs.java_home }}
          RELEASE_BUMP: ${{ needs.release-preview.outputs.release_bump }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail
          strip_snapshot() { printf '%s' "${1%-SNAPSHOT}"; }
          bump_semver() {
            local major minor patch
            IFS=. read -r major minor patch <<< "$1"
            case "$2" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
            printf '%s.%s.%s' "$major" "$minor" "$patch"
          }
          current_version="$(mvn -q -B --no-transfer-progress -f pom.xml \
            help:evaluate -Dexpression=project.version -DforceStdout)"
          release_version="$(strip_snapshot "$current_version")"
          next_dev="$(bump_semver "$release_version" "$RELEASE_BUMP")-SNAPSHOT"
          {
            echo "release_version=$release_version"
            echo "next_dev=$next_dev"
          } >> "$GITHUB_OUTPUT"

      - name: Run release:prepare as a dry run
        id: delegate
        env:
          JAVA_HOME: ${{ steps.jdk.outputs.java_home }}
          BASELINE_BRANCH: ${{ github.event.pull_request.base.ref }}
          NEXT_DEV: ${{ steps.delegated-plan.outputs.next_dev }}
          RELEASE_VERSION: ${{ steps.delegated-plan.outputs.release_version }}
        working-directory: ${{ env.WORKING_DIRECTORY }}
        shell: bash
        run: |
          set -euo pipefail

          descriptor="$GITHUB_WORKSPACE/.github/inditextech-ci-java.json"
          fail() {
            echo "reason=$1" >> "$GITHUB_OUTPUT"
            echo "::error title=release:prepare dry run::$2"
            exit 1
          }

          head_before="$(git rev-parse HEAD)"
          git tag --list | sort > "$RUNNER_TEMP/java-tags-before.txt"

          status=0
          mvn -B --no-transfer-progress -f pom.xml \
            release:clean release:prepare \
            -DpushChanges=false \
            -DdevelopmentVersion="$NEXT_DEV" \
            -Darguments="-DskipTests -DskipEnforceSnapshots" \
            -DdryRun=true || status=$?

          head_after="$(git rev-parse HEAD)"
          git tag --list | sort > "$RUNNER_TEMP/java-tags-after.txt"
          if [[ "$head_after" != "$head_before" ]] \
            || ! cmp -s "$RUNNER_TEMP/java-tags-before.txt" "$RUNNER_TEMP/java-tags-after.txt"; then
            fail not_a_dry_run "release:prepare moved HEAD or the local tags, so it did not run as a dry run."
          fi
          if [[ "$status" -ne 0 ]]; then
            fail delegate_failed "release:prepare failed in the preview sandbox."
          fi
          if [[ ! -f release.properties ]]; then
            fail no_result "release:prepare wrote no release.properties."
          fi

          property() {
            grep -E "^$1=" release.properties | head -1 | cut -d= -f2- || true
          }
          rel_of() {
            grep -E "^project\\.rel\\..*\\\\:$1=" release.properties | head -1 | cut -d= -f2- || true
          }
          dev_of() {
            grep -E "^project\\.dev\\..*\\\\:$1=" release.properties | head -1 | cut -d= -f2- || true
          }

          tag="$(property scm.tag)"
          entries="$RUNNER_TEMP/java-dry-run-versions.jsonl"
          : > "$entries"
          if [[ "$PROJECT_TYPE" == "monorepo" && "$(jq -er '.release.strategy' "$descriptor")" == "independent" ]]; then
            while IFS= read -r package; do
              module="$(printf '%s' "$package" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
              jq -cn --arg package "$module" --arg release "$(rel_of "$module")" --arg dev "$(dev_of "$module")" \
                '{package: $package, release: $release, dev: $dev}' >> "$entries"
            done < <(jq -er '.release.packages[]' "$descriptor")
          else
            root="$(mvn -q -B --no-transfer-progress -f pom.xml \
              help:evaluate -Dexpression=project.artifactId -DforceStdout)"
            jq -cn --arg package "$root" --arg release "$(rel_of "$root")" --arg dev "$(dev_of "$root")" \
              '{package: $package, release: $release, dev: $dev}' >> "$entries"
          fi
          if [[ -z "$tag" ]]; then
            fail no_result "release.properties names no scm.tag."
          fi
          {
            echo "reason=ok"
            echo "tag=$tag"
            echo "versions=$(jq -cs . "$entries")"
          } >> "$GITHUB_OUTPUT"

  delegated-release-preview-comment:
    name: Delegated Release Preview
    needs: [release-preview, delegated-release-preview]
    if: >-
      !cancelled() &&
      needs.release-preview.outputs.lifecycle_mode == 'delegated' &&
      needs.release-preview.result == 'success' &&
      needs.release-preview.outputs.release_bump != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment delegated release preview
        env:
          DEVELOPMENT_FLOW: ${{ vars.DEVELOPMENT_FLOW }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_BUMP: ${{ needs.release-preview.outputs.release_bump }}
          SANDBOX_RESULT: ${{ needs.delegated-release-preview.result }}
          SANDBOX_REASON: ${{ needs.delegated-release-preview.outputs.reason }}
          SANDBOX_TAG: ${{ needs.delegated-release-preview.outputs.tag }}
          SANDBOX_VERSIONS: ${{ needs.delegated-release-preview.outputs.versions }}
        shell: bash
        run: |
          set -euo pipefail

          header='### Java Release Preview'
          report() {
            echo "::error title=No delegated release preview::$1"
            gh pr comment "$GITHUB_EVENT_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$header"$'\n\n'"$2"
            exit 1
          }

          if [[ "$SANDBOX_RESULT" != "success" ]]; then
            case "$SANDBOX_REASON" in
              not_a_dry_run)
                report "release:prepare did not run as a dry run." \
                  "\`mvn release:prepare -DdryRun=true\` did not run as a dry run in the preview sandbox (it moved \`HEAD\` or the local tags, for example because the POM sets \`dryRun\` to false), so no release is proposed."
                ;;
              *)
                report "release:prepare did not complete in the preview sandbox." \
                  "\`mvn release:prepare -DdryRun=true\` did not complete in the preview sandbox (the plugin failed, or wrote no result), so no release is proposed; the release cut would fail the same way. See the sandbox job log."
                ;;
            esac
          fi

          tag_pattern='\A([a-z0-9][a-z0-9._-]*-)?[0-9]+\.[0-9]+\.[0-9]+\z'
          outside="\`mvn release:prepare -DdryRun=true\` reported a tag or a version outside the release patterns \`X.Y.Z\`, \`<module>-X.Y.Z\` and \`X.Y.Z-SNAPSHOT\`, so no release is proposed."
          if ! jq -e -n --arg tag "$SANDBOX_TAG" --arg pattern "$tag_pattern" '$tag | test($pattern)' > /dev/null 2>&1; then
            report "release:prepare reported a tag outside the release tag pattern." "$outside"
          fi
          if ! jq -e 'type == "array" and length > 0 and all(.[];
              (.package | type == "string" and test("\\A[a-z0-9][a-z0-9._-]*\\z")) and
              (.release | type == "string" and test("\\A[0-9]+\\.[0-9]+\\.[0-9]+\\z")) and
              (.dev | type == "string" and test("\\A[0-9]+\\.[0-9]+\\.[0-9]+-SNAPSHOT\\z")))' \
            <<< "$SANDBOX_VERSIONS" > /dev/null 2>&1; then
            report "release:prepare reported a version outside the release version patterns." "$outside"
          fi

          case "$RELEASE_BUMP" in
            major|minor|patch) : ;;
            *) report "The release type could not be read." "The release type could not be read, so no release is proposed." ;;
          esac
          merge_strategy="Create a merge commit"
          if [[ "$DEVELOPMENT_FLOW" == "trunk-based-development" ]]; then
            merge_strategy="Squash and merge"
          fi

          version_lines="$(jq -r '.[] | "- `\(.package)`: release `\(.release)`, next development `\(.dev)`"' <<< "$SANDBOX_VERSIONS")"
          body="$(printf "%s\n\n%s\n%s\n\n- Tag: \`%s\`\n- Release type: \`%s\`\n- Expected merge strategy: **%s**" \
            "$header" \
            "\`mvn release:prepare -DdryRun=true\` ran in a sandbox on the merge of this pull request with its base and reports:" \
            "$version_lines" \
            "$SANDBOX_TAG" \
            "$RELEASE_BUMP" \
            "$merge_strategy")"
          gh pr comment "$GITHUB_EVENT_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "$body"
